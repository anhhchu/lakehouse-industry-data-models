    title: Recording
    subtitle: Preparation, submission, rejection, and confirmation
    description: Recording packages, quality review, submission attempts, rejection, correction, acceptance, and official recording confirmation.
  - key: agency
    title: Agency
    subtitle: Agent authority, reporting, remittance, and oversight
    description: Independent title-agent appointments, delegated authority, policy reporting, premium remittance, exceptions, audits, and performance.
  - key: claims
    title: Claims
    subtitle: Coverage, investigation, litigation, and financials
    description: Claim notice, coverage evaluation, investigation, litigation, reserves, expenses, indemnity, recovery, subrogation, and closure.

limitations:
  - Discover sections are represented as source-controlled definitions but must currently be configured and published in the UI.
  - The seven topic areas are not UC subdomains because UC supports only one subdomain level.
