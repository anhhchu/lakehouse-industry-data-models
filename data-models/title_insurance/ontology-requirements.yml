invariants:
  - id: ONT-INV-001
    rule: Every title policy references an originating title order.
    severity: critical
    source_ids: [GDRIVE-005]
    validation: title_policy.title_order_id is not null

  - id: ONT-INV-002
    rule: Owner and lender policies remain separate policy records and policy types.
    severity: critical
    source_ids: [GDRIVE-005]
    validation: policy_type in ('owner', 'lender') and no record represents both types

  - id: ONT-INV-003
    rule: A title requirement and a policy exception are never represented by the same entity.
    severity: critical
    source_ids: [GDRIVE-003, GDRIVE-006]
    validation: separate entities and identifiers exist for title_requirement and policy_exception

  - id: ONT-INV-004
    rule: Settlement-statement lines and escrow-ledger entries remain separate records.
    severity: critical
    source_ids: [GDRIVE-004, GDRIVE-006]
    validation: separate entities exist and reconciliation does not infer ledger activity from statement lines

  - id: ONT-INV-005
    rule: Material lifecycle state changes are append-only and effective-dated.
    severity: high
    source_ids: [GDRIVE-002, GDRIVE-003, GDRIVE-005]
    validation: lifecycle entities include effective timestamp and prior states are retained

  - id: ONT-INV-006
    rule: Every material title finding cites at least one evidence record.
    severity: critical
    source_ids: [GDRIVE-003]
    validation: no material title_finding lacks a finding_evidence relationship

  - id: ONT-INV-007
    rule: Document execution, effective, submission, acceptance, and recording dates are distinct attributes.
    severity: high
    source_ids: [GDRIVE-002, GDRIVE-003, GDRIVE-004]
    validation: date attributes are modeled independently and not aliased to one physical column

  - id: ONT-INV-008
    rule: Escrow receipts minus disbursements minus remaining balance equals zero after approved adjustments for a closed accounting period.
    severity: critical
    source_ids: [GDRIVE-004, GDRIVE-007]
    validation: escrow reconciliation metric equals zero or produces a controlled exception

  - id: ONT-INV-009
    rule: Restricted bank, wire, identity, signature, tax, and non-public personal data carries restricted classification.
    severity: critical
    source_ids: [GDRIVE-004]
    validation: governed classification tags exist on all identified sensitive attributes

  - id: ONT-INV-010
    rule: A party can hold multiple simultaneous contextual roles.
    severity: high
    source_ids: [GDRIVE-001, GDRIVE-002]
    validation: party_role is a separate many-valued effective-dated entity

competency_questions:
  - id: CQ-001
    question: Which unresolved requirements are delaying scheduled closings?
    concepts: [title_requirement, closing, title_order]
  - id: CQ-002
    question: Which evidence supports a title finding and its resulting requirement or exception?
    concepts: [recorded_instrument, title_finding, title_requirement, policy_exception]
  - id: CQ-003
    question: What is the ownership-interest history for a parcel as of a specified date?
    concepts: [parcel, ownership_interest, recorded_instrument]
  - id: CQ-004
    question: Which recording packages were rejected and later accepted after correction?
    concepts: [recording_package, recording_submission, recorded_instrument]
  - id: CQ-005
    question: Which escrow files are out of balance and how long have differences remained unresolved?
    concepts: [closing, escrow_ledger]
  - id: CQ-006
    question: Which claims relate to defects previously identified during examination or underwriting?
    concepts: [title_claim, title_policy, title_finding, underwriting_decision]

classification_requirements:
  - classification: restricted
    concepts:
      - wire_instruction
      - bank_account
      - identity_document
      - signature
      - tax_identifier
      - non_public_personal_information
    source_ids: [GDRIVE-004]

review:
  required_roles:
    - title_operations
    - settlement_operations
    - underwriting
    - policy_administration
    - claims
    - data_governance
  status: pending
