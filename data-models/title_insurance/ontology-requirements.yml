version: 1
status: draft
model_scope: title_insurance
content_classification: synthetic_demo

principles:
  - id: ONT-PRN-001
    statement: Model business meaning independently from source-system structure.
  - id: ONT-PRN-002
    statement: Preserve material lifecycle history and revisions.
  - id: ONT-PRN-003
    statement: Retain evidence and provenance for title conclusions and underwriting decisions.
  - id: ONT-PRN-004
    statement: Represent roles contextually rather than as mutually exclusive party types.
  - id: ONT-PRN-005
    statement: Keep legally and operationally distinct concepts separate even when local terminology overlaps.

concepts:
  - name: title_order
    label: Title Order
    domain: title_order
    definition: A request for title, settlement, recording, or related services for a real-estate transaction.
    synonyms: [order, title file]
    distinct_from: [title_commitment, title_policy]
    source_ids: [GDRIVE-002, GDRIVE-006]

  - name: property
    label: Property
    domain: property
    definition: The real property that is the subject of an order, evidence record, closing, or policy.
    synonyms: [real property, premises]
    distinct_from: [parcel, legal_description]
    source_ids: [GDRIVE-001, GDRIVE-002]

  - name: parcel
    label: Parcel
    domain: property
    definition: A jurisdictionally identified tract or unit of land associated with a property.
    synonyms: [tax parcel, assessor parcel]
    distinct_from: [property, legal_description]
    source_ids: [GDRIVE-002]

  - name: legal_description
    label: Legal Description
    domain: property
    definition: A legally recognized textual or mapped description of land or an interest in land.
    synonyms: [property legal description]
    distinct_from: [street_address, parcel_identifier]
    source_ids: [GDRIVE-002, GDRIVE-003]

  - name: party
    label: Party
    domain: party
    definition: A person, organization, public authority, or other participant with a contextual role.
    synonyms: [participant]
    distinct_from: [party_role]
    source_ids: [GDRIVE-001, GDRIVE-008]

  - name: party_role
    label: Party Role
    domain: party
    definition: A time-bounded role held by a party in a defined business context.
    synonyms: [participant role]
    distinct_from: [party_type]
    source_ids: [GDRIVE-001, GDRIVE-002]

  - name: recorded_instrument
    label: Recorded Instrument
    domain: title_evidence
    definition: A document accepted into a recording jurisdiction's official records.
    synonyms: [recorded document, instrument]
    distinct_from: [title_finding, evidence_record]
    source_ids: [GDRIVE-003, GDRIVE-006]

  - name: ownership_interest
    label: Ownership Interest
    domain: title_evidence
    definition: A time-bounded estate, right, or interest held or alleged to be held by a party in property.
    synonyms: [title interest, ownership claim]
    distinct_from: [current_owner, party_role]
    source_ids: [GDRIVE-003]

  - name: title_search
    label: Title Search
    domain: title_evidence
    definition: The process and resulting collection of evidence from defined public and approved sources.
    synonyms: [search, search package]
    distinct_from: [title_examination]
    source_ids: [GDRIVE-002, GDRIVE-006]

  - name: title_examination
    label: Title Examination
    domain: title_evidence
    definition: Professional evaluation of evidence and the apparent condition of title.
    synonyms: [examination, exam]
    distinct_from: [title_search]
    source_ids: [GDRIVE-003, GDRIVE-006]

  - name: title_finding
    label: Title Finding
    domain: title_evidence
    definition: An examiner conclusion about title condition supported by one or more evidence records.
    synonyms: [finding]
    distinct_from: [recorded_instrument, requirement, exception]
    source_ids: [GDRIVE-003, GDRIVE-006]

  - name: title_requirement
    label: Title Requirement
    domain: title_evidence
    definition: A condition to be satisfied, waived, withdrawn, or otherwise dispositioned before closing or issuance.
    synonyms: [requirement, condition]
    distinct_from: [policy_exception]
    source_ids: [GDRIVE-003, GDRIVE-006]

  - name: policy_exception
    label: Policy Exception
    domain: policy
    definition: A matter excluded from proposed or issued title-insurance coverage.
    synonyms: [exception, exclusion]
    distinct_from: [title_requirement]
    source_ids: [GDRIVE-003, GDRIVE-006]

  - name: curative_action
    label: Curative Action
    domain: title_evidence
    definition: An action intended to resolve, mitigate, or document a title finding or requirement.
    synonyms: [curative work, cure]
    distinct_from: [underwriting_decision]
    source_ids: [GDRIVE-003, GDRIVE-006]

  - name: underwriting_decision
    label: Underwriting Decision
    domain: underwriting
    definition: A documented coverage or risk decision made under an identified authority level.
    synonyms: [underwriting approval, referral decision]
    distinct_from: [curative_action, requirement_disposition]
    source_ids: [GDRIVE-003]

  - name: title_commitment
    label: Title Commitment
    domain: underwriting
    definition: A conditional offer to issue title insurance after stated requirements are satisfied and subject to stated exceptions.
    synonyms: [commitment, preliminary report]
    distinct_from: [title_policy, title_search]
    source_ids: [GDRIVE-002, GDRIVE-006]

  - name: closing
    label: Closing
    domain: settlement
    definition: The coordinated completion of documents, approvals, funding, signing, disbursement, and recording readiness.
    synonyms: [settlement]
    distinct_from: [title_order, recording_submission]
    source_ids: [GDRIVE-004]

  - name: settlement_statement
    label: Settlement Statement
    domain: settlement
    definition: A versioned presentation of transaction charges, credits, prorations, and funds due.
    synonyms: [closing statement]
    distinct_from: [escrow_ledger]
    source_ids: [GDRIVE-004, GDRIVE-006]

  - name: escrow_ledger
    label: Escrow Ledger
    domain: escrow
    definition: The accounting record of actual escrow receipts, disbursements, adjustments, and balances.
    synonyms: [trust ledger]
    distinct_from: [settlement_statement]
    source_ids: [GDRIVE-004, GDRIVE-006]

  - name: recording_package
    label: Recording Package
    domain: recording
    definition: A set of documents prepared and submitted together for recording.
    synonyms: [recording submission package]
    distinct_from: [recorded_instrument]
    source_ids: [GDRIVE-004, GDRIVE-006]

  - name: recording_submission
    label: Recording Submission
    domain: recording
    definition: An attempt to submit a recording package or document to a recording jurisdiction.
    synonyms: [submission attempt]
    distinct_from: [recording_package, recorded_instrument]
    source_ids: [GDRIVE-002, GDRIVE-004]

  - name: title_policy
    label: Title Policy
    domain: policy
    definition: An issued contract of title insurance covering an identified insured interest subject to terms and exceptions.
    synonyms: [policy]
    distinct_from: [title_commitment]
    source_ids: [GDRIVE-005, GDRIVE-006]

  - name: policy_endorsement
    label: Policy Endorsement
    domain: policy
    definition: A form that modifies or clarifies coverage under a title policy.
    synonyms: [endorsement]
    distinct_from: [policy_exception]
    source_ids: [GDRIVE-005, GDRIVE-006]

  - name: agency_remittance
    label: Agency Remittance
    domain: agency
    definition: An agent's report and transfer of premium, taxes, and fees net of authorized retention.
    synonyms: [agent remittance]
    distinct_from: [policy_premium, commission]
    source_ids: [GDRIVE-001, GDRIVE-005]

  - name: title_claim
    label: Title Claim
    domain: claim
    definition: A demand for coverage or performance under a title policy.
    synonyms: [claim, notice of claim]
    distinct_from: [title_finding]
    source_ids: [GDRIVE-005, GDRIVE-006]

